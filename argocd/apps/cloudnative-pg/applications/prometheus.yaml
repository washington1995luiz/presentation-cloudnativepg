apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.5.4
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/argocd/apps/cloudnative-pg/prometheus/values.yaml
    - repoURL: https://github.com/washington1995luiz/presentation-cloudnativepg.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
