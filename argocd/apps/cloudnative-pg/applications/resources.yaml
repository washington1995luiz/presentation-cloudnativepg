apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/washington1995luiz/presentation-cloudnativepg.git
    targetRevision: main
    path: argocd/apps/cloudnative-pg/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
