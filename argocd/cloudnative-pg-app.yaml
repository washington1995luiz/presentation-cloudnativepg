apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/washington1995luiz/presentation-cloudnativepg.git
    targetRevision: main
    path: argocd/apps/cloudnative-pg/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
